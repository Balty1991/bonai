<!doctype html>
<html lang="ro">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BonAI — bonuri, prețuri, listă de cumpărături</title>
    <meta name="description" content="Un spațiu personal sau comun pentru buget, datorii, economii și decizii financiare clare." />
    <meta name="theme-color" content="#E4E9E6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="bf-favicon.svg?v=43" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=43" />
    <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png?v=43" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=43" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      html, body, #root { margin: 0; background: #E4E9E6; min-height: 100%; }
      html.dark, html.dark body, html.dark #root { background: #000000; }
      /*
       * Culorile foii de start (pictate înainte de CSS-ul aplicației) trec prin tokens.
       * Fiecare regulă de mai jos cere întâi tokenul real al temei (`--cf-*`, definit de
       * foaia mare) și abia apoi cade pe varianta de boot. Fără asta, regulile `!important`
       * scrise pentru tema deschisă rămâneau peste temele de noapte: titlul „Trei pași…”
       * ieșea negru pe negru, iar cardurile pașilor albe cu text alb.
       */
      :root {
        --boot-ink: #0c1612;
        --boot-muted: #4a5852;
        --boot-surface: #ffffff;
        --boot-card: #f7f8f6;
        --boot-line: #c9d2cc;
        --boot-accent: #176b54;
      }
      html.dark {
        --boot-ink: #eef2f6;
        --boot-muted: #9aa3ad;
        --boot-surface: #1c232b;
        --boot-card: #161d23;
        --boot-line: #2b333c;
        --boot-accent: #7fd7b4;
      }
      /* Același ecran ca splash-ul Android: negru, iconul de 288px în centru, fără text și fără animație. */
      #bf-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        margin: 0;
        background: #000;
        pointer-events: none;
        transition: none;
      }
      #bf-boot img { width: 288px; height: 288px; }
      html.bf-ready #bf-boot,
      #bf-boot[hidden] { display: none !important; }
      #bf-boot img { display: block; object-fit: contain; }
      html:not(.bf-ready) .bf-onboarding,
      html:not(.bf-ready) .bf-onboarding-backdrop,
      html:not(.bf-ready) .bf-first-run,
      html:not(.bf-ready) .os-shell,
      html:not(.bf-ready) .bf-page,
      html:not(.bf-ready) .bf-today-add {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }
      /* Antetul se pictează corect înainte să se încarce foaia mare de CSS. */
      .os-appbar.bf-appbar {
        display: flex !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        justify-content: space-between !important;
        gap: 10px !important;
        min-height: 64px;
      }
      .os-brand { display: flex !important; flex-shrink: 0 !important; align-items: center !important; gap: 12px !important; }
      .os-mark {
        display: grid !important;
        place-items: center !important;
        width: 40px !important;
        height: 40px !important;
        flex: 0 0 40px !important;
        overflow: hidden !important;
        border-radius: 14px !important;
        background: #FBF4E9 !important;
      }
      .os-mark img { display: block !important; width: 40px !important; height: 40px !important; object-fit: cover !important; }
      .os-tools { display: flex !important; flex-wrap: nowrap !important; flex-shrink: 0 !important; margin-left: auto !important; gap: 6px !important; }
      .os-tool {
        display: grid !important;
        place-items: center !important;
        width: 44px !important;
        height: 44px !important;
        min-width: 44px !important;
        border: 0 !important;
        border-radius: 16px !important;
      }
      /* First Run: cardul trebuie să existe înainte de foaia mare (altfel e text pe mint). */
      .bf-onboarding-backdrop.bf-first-run-backdrop {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 8px 12px 16px;
        background: #E4E9E6;
      }
      html.dark .bf-onboarding-backdrop.bf-first-run-backdrop { background: #0B0F0E; }
      .bf-onboarding.bf-first-run {
        width: min(520px, calc(100vw - 20px));
        max-height: calc(100svh - 24px);
        overflow: auto;
        padding: 22px 20px 22px;
        border-radius: 28px 28px 20px 20px;
        background: #f7f8f6 !important;
        color: #0c1612;
        border: 1px solid #c9d2cc;
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      html.dark .bf-onboarding.bf-first-run {
        background: #161225 !important;
        color: #e8eeea;
        border-color: #2a2438;
      }
      .bf-first-run-chrome {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
      }
      .bf-onboarding-skip {
        margin-left: auto;
        min-height: 44px;
        padding: 8px 12px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: inherit;
        font: 650 13px Outfit, sans-serif;
      }
      .bf-setup-visual,
      .bf-first-run .bf-setup-visual {
        display: grid !important;
        place-items: center !important;
        margin: 8px 0 12px !important;
      }
      .bf-first-run .os-mark,
      .bf-first-run .os-mark img {
        width: 72px !important;
        height: 72px !important;
        flex: 0 0 72px !important;
        border-radius: 20px !important;
      }
      .bf-setup-copy { display: grid !important; gap: 12px !important; }
      .bf-first-run .bf-kicker {
        margin: 0 !important;
        color: var(--cf-primary-strong, var(--boot-accent)) !important;
        font: 750 10px/1.2 Outfit, sans-serif !important;
        letter-spacing: .14em !important;
        text-transform: uppercase !important;
      }
      .bf-first-run h2,
      .bf-setup h2 {
        margin: 6px 0 0 !important;
        color: var(--cf-ink, var(--boot-ink)) !important;
        font: 560 28px/1.15 Georgia, "Times New Roman", serif !important;
        letter-spacing: -.02em !important;
      }
      .bf-first-run h2 em,
      .bf-setup h2 em { font-style: italic !important; }
      .bf-setup-copy p {
        margin: 0 !important;
        color: var(--cf-muted, var(--boot-muted)) !important;
        font: 400 14px/1.5 Outfit, sans-serif !important;
      }
      .bf-first-run-intents { display: grid; gap: 10px; margin-top: 1.1rem; }
      .bf-first-run-intents button {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 2px 12px;
        align-items: start;
        min-height: 72px;
        padding: 14px 16px;
        text-align: left;
        border-radius: 18px;
        border: 1px solid #c9d2cc;
        background: #eef1ef;
        color: inherit;
      }
      html.dark .bf-first-run-intents button {
        border-color: #2a2438;
        background: #1c1830;
      }
      .bf-first-run-intents button b { font: 650 15px/1.25 Georgia, serif; }
      .bf-first-run-intents button small { color: var(--cf-muted, var(--boot-muted)); font: 500 12px/1.4 Outfit, sans-serif; }
      .os-hero {
        display: grid !important;
        gap: 0;
        margin: 0 16px !important;
        padding: 20px !important;
        border-radius: 2rem !important;
        background: var(--cf-surface, var(--boot-card)) !important;
        box-shadow: 0 0 0 1px var(--cf-line, var(--boot-line)) !important;
      }
      .os-start-title {
        margin: 0 !important;
        color: var(--cf-ink, var(--boot-ink)) !important;
        font: 560 28px/1.18 Georgia, "Times New Roman", serif !important;
      }
      .os-start-steps {
        list-style: none !important;
        margin: 6px 0 0 !important;
        padding: 0 !important;
        display: grid !important;
        gap: 8px !important;
      }
      .os-start-steps button {
        display: flex !important;
        width: 100% !important;
        align-items: center !important;
        gap: 12px !important;
        min-height: 56px !important;
        padding: 12px 14px !important;
        text-align: left !important;
        border-radius: 16px !important;
        border: 1px solid var(--cf-line, var(--boot-line)) !important;
        background: var(--cf-surface, var(--boot-surface)) !important;
        color: var(--cf-ink, var(--boot-ink)) !important;
      }
    </style>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { void reg.update(); });
        });
      }
    </script>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var legacy = { snow: "white", ivory: "white", ink: "white", sand: "white", sage: "white", slate: "white", lagoon: "dark", forest: "dark", midnight: "navy", plum: "navy", graphite: "dark", copper: "dark", rosewood: "dark", aurora: "navy", cyber: "dark" };
          var theme = localStorage.getItem("buget-familie:theme") || "white";
          if (legacy[theme]) theme = legacy[theme];
          var schedule = localStorage.getItem("buget-familie:theme-schedule");
          if (schedule === "system" || !localStorage.getItem("bonai:look-v1") || (!schedule && !localStorage.getItem("buget-familie:setup-complete"))) {
            theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "white";
          } else if (schedule === "auto") {
            var now = new Date();
            var minutes = now.getHours() * 60 + now.getMinutes();
            var times = { dayStart: "06:00", eveningStart: "17:00", nightStart: "21:00" };
            try {
              var saved = JSON.parse(localStorage.getItem("buget-familie:theme-schedule-times") || "null");
              if (saved) Object.assign(times, saved);
            } catch (e) {}
            var toMin = function (value, fallback) {
              var parts = String(value || "").split(":");
              var hours = Number(parts[0]);
              var mins = Number(parts[1]);
              return Number.isFinite(hours) && Number.isFinite(mins) ? hours * 60 + mins : fallback;
            };
            var day = toMin(times.dayStart, 360);
            var evening = toMin(times.eveningStart, 1020);
            var night = toMin(times.nightStart, 1260);
            theme = minutes >= day && minutes < evening ? "white" : minutes >= evening && minutes < night ? "navy" : "dark";
          }
          var known = { white: 1, dark: 1, navy: 1 };
          if (!known[theme]) theme = "white";
          var background = localStorage.getItem("buget-familie:background") || "plain";
          if (!{ plain: 1, paper: 1, grid: 1, aurora: 1, dots: 1 }[background]) background = "plain";
          root.classList.add("theme-" + theme, "background-" + background);
          var dark = theme !== "white";
          if (dark) root.classList.add("dark");
          var paint = dark ? "#000000" : "#E4E9E6";
          root.style.backgroundColor = paint;
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", paint);
          var boot = document.getElementById("bf-boot");
          if (boot) boot.style.background = paint;
          if (localStorage.getItem("buget-familie:high-contrast") === "true") root.classList.add("bf-high-contrast");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="bf-boot" aria-hidden="true"><img src="icons/splash-mark.png?v=1" alt="" width="288" height="288" decoding="sync" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
