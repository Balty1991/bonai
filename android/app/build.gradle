apply plugin: 'com.android.application'

// Semnarea de release citește dintr-un fișier local, NECOMIS (vezi .gitignore), generat
// de workflow-ul "Release Android AAB" din secretele GitHub, sau creat manual pentru build local.
// Fără acest fișier, buildTypes.release rămâne nesemnat — assembleDebug nu este afectat.
def releaseKeystorePropertiesFile = file('release-keystore.properties')
def releaseKeystoreProperties = new Properties()
if (releaseKeystorePropertiesFile.exists()) {
    releaseKeystoreProperties.load(new FileInputStream(releaseKeystorePropertiesFile))
}
def hasReleaseSigning = releaseKeystoreProperties.getProperty('storeFile') != null

android {
    namespace = "ro.balty1991.bugetfamilie"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ro.balty1991.bugetfamilie"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 240
        versionName "2.6.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        setProperty("archivesBaseName", "BonAI")
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystoreProperties.getProperty('storeFile'))
                storePassword releaseKeystoreProperties.getProperty('storePassword')
                keyAlias releaseKeystoreProperties.getProperty('keyAlias')
                keyPassword releaseKeystoreProperties.getProperty('keyPassword')
                // v1 pentru telefoane vechi, v2 și v3 ca Android să poată verifica
                // că APK-ul nu a fost modificat după semnare.
                v1SigningEnabled true
                v2SigningEnabled true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'androidx.work:work-runtime:2.9.1'
    // @capgo/native-purchases aduce Guava doar la rulare; Gradle aliniază atunci și compilarea pe
    // „listenablefuture:9999.0-empty”, iar ReminderWorker nu mai găsește ListenableFuture.
    // Aceeași versiune ca pluginul: e deja în APK, deci nu crește dimensiunea.
    implementation 'com.google.guava:guava:33.7.1-android'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.google.android.play:review:2.0.2'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
