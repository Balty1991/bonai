name: Interfață pe telefon

# Aplicația reală, cu date de test: ecranele principale × Alb / Întunecat / Navy × 360 și 412 px
# (text ieșit din ecran, strivit, contrast sub WCAG AA, erori) și fluxurile de bază (notare și
# anulare, plic nou, plata ratei, ștergere, ciclu salariu, temă automată).

on:
  push:
    branches: [main]
    paths:
      - "client/src/**"
      - "e2e/layout.e2e.mjs"
      - "e2e/review-scroll.e2e.mjs"
      - "client/e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/layout-e2e.yml"
  pull_request:
    paths:
      - "client/src/**"
      - "e2e/layout.e2e.mjs"
      - "e2e/review-scroll.e2e.mjs"
      - "client/e2e/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        # apt (oglinda Azure) rămâne uneori agățat 20 de minute: 5 minute pe încercare, de cel mult 3 ori.
        run: |
          for attempt in 1 2 3; do
            timeout 300 pnpm exec playwright-core install --with-deps chromium && exit 0
            echo "Instalarea Chromium n-a mers (încercarea $attempt), reîncerc."
          done
          exit 1
      - name: Verifică interfața
        # Teme × lățimi plus trecerea cu fontul telefonului la 130%.
        timeout-minutes: 20
        run: pnpm test:layout
      - name: Verifică derularea ecranului de verificare a bonului
        timeout-minutes: 5
        run: pnpm test:review-scroll
      - name: Verifică scanerul de cod de bare
        timeout-minutes: 5
        run: pnpm test:barcode
      - name: Verifică editarea și ștergerea bonului
        timeout-minutes: 5
        run: pnpm test:receipt-edit
