name: Publică regulile Firestore

# Publică firestore.chain.rules (etapa 3: lanțul de scriere) în producție, dar numai după ce
# testul cap-coadă a trecut pe emulator cu exact aceste reguli. Nu scrie nimic în baza reală.
# La final citește înapoi regula publicată, ca verificare.
# Revenire de urgență: firebase.json → "rules": "firestore.auth.rules" (etapa 2) și push.

on:
  push:
    branches: [main]
    paths:
      - "firestore.chain.rules"
      - "firestore.auth.rules"
      - "firebase.json"
      - ".github/workflows/deploy-firestore-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-production
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: buget-familie-a6a0d

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Java (emulatorul Firestore)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Regulile din firebase.json sunt cele testate
        run: |
          set -euo pipefail
          published=$(node -e 'console.log(require("./firebase.json").firestore.rules)')
          tested=$(node -e 'console.log(require("./firebase.e2e.json").firestore.rules)')
          echo "Se publică: $published · testate: $tested"
          [ "$published" = "$tested" ]

      - name: Test sync cap-coadă pe regulile care se publică
        timeout-minutes: 12
        run: pnpm test:sync

  # Publicarea e alt job: codul din dependențe și testele de mai sus nu rulează niciodată
  # lângă credențialul de producție (S3).
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token: GitHub poate cere la Google o permisiune de câteva minute (Workload Identity Federation).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Firebase CLI din lockfile (cu toate dependențele fixate), fără scripturi de instalare.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Fără cheie salvată: Google are încredere direct în acest workflow, doar din acest repo și de pe main
      # (Workload Identity Federation, variabilele GCP_WIF_PROVIDER și GCP_SERVICE_ACCOUNT; docs/GHID-APPCHECK-WIF.md).
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      # Un rol IAM proaspăt dat contului de serviciu are nevoie de câteva minute ca să se aplice.
      - name: Publică regulile
        run: |
          set -uo pipefail
          for try in 1 2 3; do
            if pnpm exec firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive --force; then exit 0; fi
            echo "Încercarea $try nu a reușit; aștept 60 s."
            sleep 60
          done
          echo "::error::Contul de serviciu are nevoie de rolul Firebase Rules Admin (Google Cloud → IAM)."
          exit 1

      - name: Verifică regula publicată
        run: |
          set -euo pipefail
          token=$(gcloud auth print-access-token)
          api="https://firebaserules.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}"
          ruleset=$(curl -sS -H "Authorization: Bearer ${token}" "${api}/releases/cloud.firestore" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).rulesetName))')
          curl -sS -H "Authorization: Bearer ${token}" "https://firebaserules.googleapis.com/v1/${ruleset}" > /tmp/ruleset.json
          if grep -q "chainContinues" /tmp/ruleset.json; then echo "Etapa 3 (lanțul de scriere) e publicată: ${ruleset}"; else echo "::error::Regula publicată nu conține lanțul de scriere"; exit 1; fi
