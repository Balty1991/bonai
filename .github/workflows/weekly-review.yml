name: Revizia aplicației

# Luni și joi la 7:47 (ora României, vara și iarna): toate verificările aplicației, apoi Claude Haiku 5.5 citește
# rezultatele și scrie raportul ca Issue cu eticheta „revizie” (GitHub îl trimite și pe mail).
# Cost: cam 1–2 cenți pe revizie. Se poate porni și de mână, din Actions → „Revizia aplicației”.

on:
  # GitHub programează în UTC: 4:47 UTC e 7:47 vara, 5:47 UTC e 7:47 iarna. Rulează amândouă,
  # iar pasul „ora” lasă să continue doar cea care e 7:47 în fusul României de azi.
  schedule:
    - cron: "47 4 * * 1,4"
    - cron: "47 5 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-review
  cancel-in-progress: false

jobs:
  ora:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        # După fusul României de azi (+03 vara, +02 iarna), nu după ora de acum: GitHub pornește
        # programările uneori cu întârziere, iar o rulare de 4:47 venită la 5:05 nu trebuie pierdută.
        run: |
          offset=$(TZ=Europe/Bucharest date +%z)
          wanted="47 5 * * 1,4"; [ "$offset" = "+0300" ] && wanted="47 4 * * 1,4"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "$wanted" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
          echo "Fusul României: $offset · programarea: ${{ github.event.schedule }} · aleasă: $wanted"

  review:
    needs: ora
    if: needs.ora.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 50
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fiecare verificare își scrie codul de ieșire, logul și durata; niciuna nu oprește revizia.
      - name: Rulează verificările
        timeout-minutes: 60
        run: |
          # O verificare picată nu oprește pasul: o notăm și trecem la următoarea.
          set +e
          mkdir -p review
          check() {
            local name="$1"; shift
            local start=$(date +%s)
            bash -c "$*" > "review/$name.log" 2>&1
            echo $? > "review/$name.status"
            echo $(( $(date +%s) - start )) > "review/$name.seconds"
            echo "$name: cod $(cat review/$name.status), $(cat review/$name.seconds) s"
          }
          check typecheck "pnpm check"
          check lint "pnpm lint"
          check unit "pnpm test"
          check functions "cd functions && npm ci --no-audit --no-fund && npx tsc --noEmit -p ."
          check audit "pnpm audit --prod --audit-level high"
          # apt (oglinda Azure) rămâne uneori agățat: 5 minute pe încercare, de cel mult 3 ori.
          for attempt in 1 2 3; do timeout 300 pnpm exec playwright-core install --with-deps chromium && break; done
          check layout "timeout 1500 pnpm test:layout"
          check server "timeout 300 node e2e/receipt-smoke.mjs"
          git log --since="5 days ago" --pretty=format:"%h %ad %s" --date=short > review/changes.txt || true
          head -60 docs/CHANGELOG.md > review/changelog.txt || true

      # Pentru explorarea liberă: ce zone a cercetat în rapoartele trecute și ce fișiere s-au schimbat recent.
      - name: Memoria reviziilor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label revizie --state all --limit 12 --json body > review/previous.json || echo "[]" > review/previous.json
          git log --since="14 days ago" --name-only --pretty=format: | grep -E '\.(tsx?|mjs|java)$' | sort | uniq -c | sort -rn | head -40 > review/hot-files.txt || true

      - name: Raportul (Claude Haiku 5.5)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_NOTIFY: ${{ github.repository_owner }}
        run: node e2e/weekly-review.mjs

      - name: Deschide Issue cu raportul
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create revizie --color 1B4F42 --description "Revizia automată a aplicației" --force
          gh issue create --title "$(cat review/title.txt)" --body-file review/report.md --label revizie

      - name: Păstrează logurile
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: revizie-loguri
          path: review/
          retention-days: 14
