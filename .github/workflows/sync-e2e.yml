name: Sync familie cap-coadă

# Două „telefoane” pe aplicația reală, cu Firestore și Auth locale (emulatoare, fără date reale)
# de două ori: pe regulile etapei 3 (firestore.chain.rules, lanțul de scriere) și pe cele
# publicate acum (etapa 2, firestore.auth.rules):
# invitație, cine a cheltuit, reconectare după redeschidere, mutare de pe parolă.
# Nu oprește publicarea site-ului; arată dacă sincronizarea s-a stricat.

on:
  push:
    branches: [main]
    paths:
      - "client/src/**"
      - "e2e/**"
      - "firestore.rules"
      - "firestore.auth.rules"
      - "firestore.chain.rules"
      - "firebase.json"
      - "firebase.e2e.json"
      - "firebase.e2e.auth.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/sync-e2e.yml"
  pull_request:
    paths:
      - "client/src/**"
      - "e2e/**"
      - "firestore.rules"
      - "firestore.auth.rules"
      - "firestore.chain.rules"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Java (emulatorul Firestore)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache emulator Firestore
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        # apt (oglinda Azure) rămâne uneori agățat 20 de minute: 5 minute pe încercare, de cel mult 3 ori.
        run: |
          for attempt in 1 2 3; do
            timeout 300 pnpm exec playwright-core install --with-deps chromium && exit 0
            echo "Instalarea Chromium n-a mers (încercarea $attempt), reîncerc."
          done
          exit 1
      - name: Test sync cap-coadă
        timeout-minutes: 12
        run: pnpm test:sync
      - name: Aceeași aplicație pe regulile publicate acum (etapa 2)
        timeout-minutes: 12
        run: pnpm test:sync:current
