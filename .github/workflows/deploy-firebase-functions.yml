name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "e2e/receipts/**"
      - "e2e/receipt-smoke.mjs"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-functions-production
  cancel-in-progress: true

env:
  FIREBASE_PROJECT_ID: buget-familie-a6a0d
  FUNCTIONS_REGION: europe-central2

jobs:
  deploy:
    name: Validate and deploy Firebase Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: GitHub poate cere la Google o permisiune de câteva minute (Workload Identity Federation).
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Firebase CLI din lockfile-ul proiectului (dependențe fixate), fără scripturi de instalare (S3).
      - name: Install Firebase CLI from lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install function dependencies
        working-directory: functions
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Type-check Firebase Functions
        working-directory: functions
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build Firebase Functions
        working-directory: functions
        run: npm run build

      # Fără cheie salvată: Google are încredere direct în acest workflow, doar din acest repo și de pe main
      # (Workload Identity Federation, variabilele GCP_WIF_PROVIDER și GCP_SERVICE_ACCOUNT; docs/GHID-APPCHECK-WIF.md).
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Enable Gemini API
        run: gcloud services enable generativelanguage.googleapis.com --project "$FIREBASE_PROJECT_ID"

      # Identitatea anonimă a telefoanelor (docs/ANONYMOUS_AUTH.md). Dacă contul de serviciu
      # nu are drept pe configurația Auth, pasul spune ce e de făcut în consolă, fără să
      # oprească publicarea funcțiilor: aplicația merge și fără identitate.
      - name: Enable anonymous sign-in (Firebase Auth)
        continue-on-error: true
        run: |
          set -uo pipefail
          gcloud services enable identitytoolkit.googleapis.com --project "$FIREBASE_PROJECT_ID" || true
          token=$(gcloud auth print-access-token)
          config="https://identitytoolkit.googleapis.com/admin/v2/projects/${FIREBASE_PROJECT_ID}/config"
          status=$(curl -sS -o /tmp/auth-config.json -w '%{http_code}' -X PATCH "${config}?updateMask=signIn.anonymous.enabled" \
            -H "Authorization: Bearer ${token}" -H "x-goog-user-project: ${FIREBASE_PROJECT_ID}" \
            -H 'content-type: application/json' --data '{"signIn":{"anonymous":{"enabled":true}}}')
          if [ "$status" = "200" ] && grep -q '"anonymous"' /tmp/auth-config.json; then
            echo "Anonymous sign-in is enabled."
          else
            echo "::warning::Anonymous sign-in could not be enabled (HTTP $status). Firebase Console → Authentication → Get started → Sign-in method → Anonymous → Enable."
            head -c 600 /tmp/auth-config.json || true
            exit 1
          fi

      - name: Sync Gemini and Groq secrets to Secret Manager
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          sync_secret() {
            local name="$1"
            local value="$2"
            if ! gcloud secrets describe "$name" --project "$FIREBASE_PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets create "$name" \
                --project "$FIREBASE_PROJECT_ID" \
                --replication-policy=automatic
              printf '%s' "${value:-pending}" | gcloud secrets versions add "$name" \
                --project "$FIREBASE_PROJECT_ID" \
                --data-file=-
              return
            fi
            # Fiecare versiune activă se plătește lunar (Secret Manager): una nouă doar dacă cheia chiar s-a schimbat.
            if [ -n "$value" ] && [ "$(gcloud secrets versions access latest --secret "$name" --project "$FIREBASE_PROJECT_ID" 2>/dev/null || true)" = "$value" ]; then
              echo "$name is unchanged; no new version."
            elif [ -n "$value" ]; then
              printf '%s' "$value" | gcloud secrets versions add "$name" \
                --project "$FIREBASE_PROJECT_ID" \
                --data-file=-
            else
              echo "$name is not in GitHub secrets; keeping the existing Firebase secret."
            fi
          }
          sync_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          sync_secret GROQ_API_KEY "$GROQ_API_KEY"
          sync_secret ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"

      # Contoarele de limită (aiGuide, Play) au câmpul expireAt; Firestore le șterge singur după el.
      # Dacă contul de serviciu nu are drept pe câmpuri, pasul avertizează și nu oprește publicarea.
      - name: Politică TTL pe contoarele de limită
        continue-on-error: true
        run: |
          set -uo pipefail
          for group in aiGuideQuota aiGuideQuotaUnverified aiConsultQuota playVerifyQuota playRtdnQuota appFeedbackQuota readReceiptQuota; do
            gcloud firestore fields ttls update expireAt --collection-group="$group" --enable-ttl --async --project "$FIREBASE_PROJECT_ID" --quiet \
              || echo "::warning::TTL pentru $group nu s-a putut porni (rolul Cloud Datastore Index Admin pe contul de serviciu, sau Firebase Console → Firestore → TTL)."
          done
          echo "Politici TTL active:"
          gcloud firestore fields ttls list --project "$FIREBASE_PROJECT_ID" --quiet || true

      - name: Deploy Firebase Functions
        run: pnpm exec firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive --force

      # Funcțiile publicate folosesc doar ultima versiune; celelalte rămâneau active și se plăteau în fiecare lună.
      - name: Distruge versiunile vechi ale secretelor
        continue-on-error: true
        run: |
          set -uo pipefail
          for name in GEMINI_API_KEY GROQ_API_KEY ANTHROPIC_API_KEY; do
            latest=$(gcloud secrets versions describe latest --secret "$name" --project "$FIREBASE_PROJECT_ID" --format='value(name.basename())') || continue
            for version in $(gcloud secrets versions list "$name" --project "$FIREBASE_PROJECT_ID" --filter='state!=DESTROYED' --format='value(name.basename())'); do
              [ "$version" = "$latest" ] && continue
              gcloud secrets versions destroy "$version" --secret "$name" --project "$FIREBASE_PROJECT_ID" --quiet \
                || echo "::warning::$name versiunea $version nu s-a putut distruge (rolul Secret Manager Admin pe contul de serviciu)."
            done
          done

      # Imaginile funcțiilor din Artifact Registry se adunau la fiecare deploy; peste 0.5 GB se plătesc.
      # Deploy-ul încearcă singur, dar raportează doar „Failed”; aici se vede motivul.
      - name: Politică de ștergere a imaginilor vechi (Artifact Registry)
        continue-on-error: true
        run: |
          set -uo pipefail
          pnpm exec firebase functions:artifacts:setpolicy --location "$FUNCTIONS_REGION" --days 1 \
            --project "$FIREBASE_PROJECT_ID" --non-interactive --force \
            || { echo "::warning::Politica de ștergere a imaginilor nu s-a putut seta (rolul Artifact Registry Administrator pe contul de serviciu)."; exit 1; }

      - name: Check aiGuide endpoint
        run: |
          set -euo pipefail
          # Ghidul depinde de Gemini / Groq: o încetineală de moment la ei nu înseamnă că publicarea e stricată.
          # O a doua încercare după 20 s; două eșecuri la rând opresc workflow-ul.
          for try in 1 2; do
            status=$(curl -sS -m 70 -o /tmp/aiguide-health.json -w '%{http_code}' \
              -X POST "https://${FUNCTIONS_REGION}-${FIREBASE_PROJECT_ID}.cloudfunctions.net/aiGuide" \
              -H 'content-type: application/json' \
              --data '{"messages":[{"role":"user","text":"test de disponibilitate"}],"context":{}}' || echo 000)
            if [ "$status" = "200" ] || [ "$status" = "429" ]; then
              echo "aiGuide endpoint responded successfully (HTTP $status, try $try)."
              exit 0
            fi
            echo "aiGuide endpoint returned HTTP $status (try $try). Response body:"
            cat /tmp/aiguide-health.json || true
            [ "$try" = "1" ] && sleep 20
          done
          exit 1

      - name: Check readReceipt endpoint
        run: |
          set -euo pipefail
          # Fără identitatea telefonului, funcția trebuie să refuze (401) înainte să cheme modelul.
          status=$(curl -sS -m 30 -o /tmp/receipt-health.json -w '%{http_code}' \
            -X POST "https://${FUNCTIONS_REGION}-${FIREBASE_PROJECT_ID}.cloudfunctions.net/readReceipt" \
            -H 'content-type: application/json' --data '{}' || echo 000)
          echo "readReceipt HTTP $status"; cat /tmp/receipt-health.json || true
          [ "$status" = "401" ]

      - name: Scanează bonurile de test (e2e/receipts)
        run: node e2e/receipt-smoke.mjs
